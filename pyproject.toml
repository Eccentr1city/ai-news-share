[project]
name = "ai-news-share"
version = "0.1.0"
description = "Share of top news stories about AI, compared with Covid in 2020"
readme = "README.md"
authors = [
    { name = "Adam Kaufman", email = "adam@drleora.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
ai-news-share = "ai_news_share:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
