name: daily update
on:
  schedule:
    - cron: "23 13 * * *"   # 13:23 UTC daily (~9:23 ET)
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Fetch data and print report
        run: uv run ai-news-share update
        timeout-minutes: 40
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: $(date -u +%F)" || echo "no changes"
          git push
